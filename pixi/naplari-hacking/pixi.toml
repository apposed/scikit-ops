[project]
name = "naplari-hacking"
authors = ["bnorthan <bnorthan@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
napari = "*"
pyqt = "*"
cellpose = ">=4"
ipykernel = "*"
pip = "*"

[target.linux-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"
cuda-version = "12.2"

[target.win-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"

[target.osx-arm64.dependencies]
pytorch = "*"

[pypi-dependencies]
naplari-hacking = { path = "../..", editable = true }

[tasks]
register-kernel = "python -m ipykernel install --user --name=naplari-hacking --display-name 'naplari-hacking'"
