[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scikit-ops"
version = "0.1.0"
description = "Appose-powered ops, and the machinery for running them"
requires-python = ">=3.10"
dependencies = [
    "appose>=0.11",
    "numpy",
]

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
    "toml",
    "validate-pyproject[all]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skop"]

[tool.ruff]
line-length = 88
# Vendored upstream algorithm: keep it diffable against its source.
extend-exclude = ["src/skop/ops/segment/unseg/_algorithm.py"]

[tool.ruff.lint.isort]
known-first-party = ["skop"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
