[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scikit-ops"
version = "0.1.0.dev0"
description = "Appose-powered ops, and the machinery for running them."
license = "BSD-2-Clause"
authors = [{name = "scikit-ops developers"}]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

requires-python = ">=3.10"
dependencies = [
    "appose>=0.11",
    "numpy",
]

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
    "toml",
    "validate-pyproject[all]",
]

[project.urls]
homepage = "https://github.com/apposed/scikit-ops"
documentation = "https://github.com/apposed/scikit-ops/blob/main/README.md"
source = "https://github.com/apposed/scikit-ops"
download = "https://pypi.org/project/scikit-ops"
tracker = "https://github.com/apposed/appose/issues"

[tool.uv.sources]
# Note: the main tip, not the 0.11 release, for PixiInstallMonitor -- it is
# what makes an environment build report anything more than "done". Pin this
# back to the registry once a release carries it.
appose = { git = "https://github.com/apposed/appose-python", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/skop"]

[tool.ruff]
line-length = 88
# Vendored upstream algorithm: keep it diffable against its source.
extend-exclude = ["src/skop/ops/segment/unseg/_algorithm.py"]

[tool.ruff.lint.isort]
known-first-party = ["skop"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "env(env_id): needs op environment <env_id>; skipped unless it is already built or --build-envs is passed",
    "gpu: needs an NVIDIA GPU; skipped when none is present, --build-envs or not",
]
