[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scikit-ops"
version = "0.1.0.dev0"
description = "Appose-powered ops, and the machinery for running them."
license = "BSD-2-Clause"
authors = [{name = "scikit-ops developers"}]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

requires-python = ">=3.10"
dependencies = [
    "appose>=0.12",
    "numpy",
]

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
    "toml",
    "validate-pyproject[all]",
]
# The host the notebooks and interactive tests run in -- not an op
# environment. Ops bring their own; this holds only what an example itself
# imports, plus the kernel. ipykernel is named rather than left to arrive with
# jupyterlab, because VS Code starts the kernel itself and never sees
# jupyterlab at all.
#
# pixi/examples builds the same environment with the other tool, and the two
# are meant to stay in step -- same name, same contents.
examples = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "scikit-image",
    "tifffile",
    # Projection figures -- xy beside zy, with the z axis stretched to match
    # the voxel aspect. A host dependency, deliberately: no op imports it, and
    # the decon code migrated out of tnia-python rather than wrapping it. If
    # that reverses later -- several decon backends worth wrapping rather than
    # porting -- this line stays and an op-level one joins it.
    # `[plotting]` only: the base install is bare, and the other extras drag in
    # albumentations and friends that nothing here calls.
    "tnia-python[plotting]",
    # The interactive tests open a viewer, so the examples host carries one.
    # NB: PyQt6 rather than PyQt5, which ships no Apple Silicon wheels -- the
    # pixi side takes conda-forge's `pyqt` instead, where that is not a
    # constraint.
    "napari[pyqt6]",
]

[tool.uv]
# Kept in .venv by default, so a bare `uv sync` does not strip the kernel out
# from under VS Code -- it prunes anything the selected groups do not name.
default-groups = ["dev", "examples"]

[project.urls]
homepage = "https://github.com/apposed/scikit-ops"
documentation = "https://github.com/apposed/scikit-ops/blob/main/README.md"
source = "https://github.com/apposed/scikit-ops"
download = "https://pypi.org/project/scikit-ops"
tracker = "https://github.com/apposed/appose/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skop"]

# skop builds each op's environment from envs/<env-id>/pixi.toml. Without these
# a wheel installs code that cannot build anything.
#
# Mapped in, not moved: site-packages is shared, so a top-level envs/ would be a
# name nobody owns. The repo keeps its layout; runner._default_envs_dir prefers
# a checkout when there is one. The pixi.lock files come too, so an install
# resolves to the developer's packages rather than today's channels.
[tool.hatch.build.targets.wheel.force-include]
"envs" = "skop/envs"

[tool.ruff]
line-length = 88
# Vendored upstream algorithm: keep it diffable against its source.
extend-exclude = ["src/skop/ops/segment/unseg/_algorithm.py"]

[tool.ruff.lint.isort]
known-first-party = ["skop"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "env(env_id): needs op environment <env_id>; skipped unless it is already built or --build-envs is passed",
    "gpu: needs an NVIDIA GPU; skipped when none is present, --build-envs or not",
]
