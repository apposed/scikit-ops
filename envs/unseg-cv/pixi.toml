[workspace]
name = "skop-unseg-cv"
description = "UNSEG's stack: an older scikit-image, scikit-learn and OpenCV."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "0.1.0"

# Pins are inherited from unseg-fiji, where the algorithm is known to produce
# correct results. They are old enough that this env can share nothing with
# the others -- which is precisely why environments are per-stack.

[dependencies]
python = "3.9.*"
numpy = "==1.24.3"
scipy = "==1.9.1"
scikit-image = "==0.20.0"
scikit-learn = "==1.2.2"
# NB: unseg-fiji pinned appose 0.7.2, but skop's worker adapter needs the
# service init script support added later.
appose = ">=0.11"

[pypi-dependencies]
# NB: the one environment with no pinned scikit-ops. Every other one installs
# it, so that a worker needs no checkout; this one cannot, because scikit-ops
# requires Python 3.10 and UNSEG's pins 3.9. It runs off the sys.path
# injection alone, which is what got it working in the first place.
opencv-python-headless = "==4.7.0.72"
