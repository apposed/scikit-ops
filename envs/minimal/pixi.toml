[workspace]
name = "skop-minimal"
description = "Smallest environment an op can run in: python, numpy, appose."
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
numpy = "*"
# NB: appose is not listed as a conda dependency here, unlike in
# envs/unseg-cv, and this is temporary. A conda appose does satisfy the
# pinned scikit-ops' PyPI dependency on it -- but only once the pin is new
# enough to have dropped scikit-ops' [tool.uv.sources] git source for
# appose, which uv honors transitively and which makes the solve
# unsatisfiable. So this goes back to `appose = ">=0.12"` above as soon as
# the rev below is bumped past that change and conda-forge carries 0.12.

[pypi-dependencies]
# Note: pinned deliberately -- this is part of the environment's identity,
# so bumping it rebuilds every environment. It comes from PyPI, so building
# needs no checkout; a checkout still shadows it (see oprunner.host.INIT).
scikit-ops = "==0.1.0.dev2"
