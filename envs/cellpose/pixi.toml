[workspace]
name = "skop-cellpose"
description = "Cellpose segmentation, on PyTorch."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
numpy = "*"
cellpose = ">=4"
appose = ">=0.11"

# PyTorch varies by platform: CUDA builds where there are GPUs to use,
# and the plain package on Apple Silicon, where MPS comes built in.
[target.linux-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"
cuda-version = "12.2"

[target.win-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
