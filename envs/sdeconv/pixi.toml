[workspace]
name = "skop-sdeconv"
description = "sdeconv, for the Gibson-Lanni PSF model."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

# This environment exists only because sdeconv is not on conda-forge at a
# usable version: the channel carries 0.1.0, a py38 build, and the API this op
# needs (`sdeconv.psfs.SPSFGibsonLanni`) arrived in 1.x. So sdeconv comes from
# PyPI, and everything it depends on comes from conda -- see the note on
# [pypi-dependencies] below.
#
# It is deliberately NOT its own torch stack. Every conda dependency here is
# stated exactly as envs/pytorch states it -- same channel, same python, same
# torch packages, same CUDA -- so that the two environments solve to the same
# builds and pixi hard-links one copy out of the shared package cache instead
# of unpacking a second multi-gigabyte torch.
#
# That is a deliberate reversal of what design 0010 first proposed. The spec
# suggested pinning a CPU-only torch, reasoning that generating a PSF is small
# work and needs no GPU. True, but conda package identity is
# name-version-buildstring, and `pytorch-cpu ... cpu_py311_*` and
# `pytorch-gpu ... cuda129_mkl_py311_*` share no bytes at all. A CPU pin saves
# space only on a machine that has no other torch environment, and costs a
# full extra copy on any machine that does -- which, since fastsam lives in
# envs/pytorch, is the machine a developer here actually has.
#
# Keeping it aligned is also what makes the merge cheap. If sdeconv earns its
# way into the canonical environment later, folding it in is deleting this
# file and adding one line to envs/pytorch's [pypi-dependencies]; nothing
# about the conda half has to be reconciled first.
#
# The one thing to keep in step by hand: envs/pytorch leaves torch unpinned
# (`pytorch-gpu = "*"`), so two environments solved months apart can land on
# different versions and share nothing. If that starts to bite, pin both to
# the same version rather than pinning only this one.

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.11.*"
numpy = "*"
# NB: appose is not listed as a conda dependency here, unlike in
# envs/unseg-cv, and this is temporary. A conda appose does satisfy the
# pinned scikit-ops' PyPI dependency on it -- but only once the pin is new
# enough to have dropped scikit-ops' [tool.uv.sources] git source for
# appose, which uv honors transitively and which makes the solve
# unsatisfiable. So this goes back to `appose = ">=0.12"` above as soon as
# the rev below is bumped past that change and conda-forge carries 0.12.

# sdeconv's own declared dependencies, satisfied from conda rather than left
# to PyPI. This is the same lesson envs/segment-everything records: left to
# resolve them itself, uv matches `torchvision` against the torch the conda
# solve already pinned, finds no published wheel that fits, and the solve
# fails outright. Stating them here leaves uv nothing to resolve but sdeconv.
scipy = "*"
scikit-image = "*"
torchvision = "*"

[pypi-dependencies]
# Note: pinned deliberately -- this is part of the environment's identity,
# so bumping it rebuilds every environment. A checkout still shadows it,
# because skop.host.INIT puts src at sys.path[0]. See
# docs/spec/fiji-front-end.md; it becomes an ordinary version constraint
# once scikit-ops is released.
scikit-ops = { git = "https://github.com/apposed/scikit-ops.git", rev = "dc46a814ffbc4287d0496d5213d7e1661652ed9b" }
sdeconv = ">=1,<2"

# Torch, stated exactly as envs/pytorch states it: CUDA builds where there are
# GPUs, and the plain package on Apple Silicon where MPS is built in. Nothing
# here uses a GPU -- a Gibson-Lanni PSF is a small FFT -- but matching the
# canonical environment is worth more than the GPU build being unnecessary.
[target.linux-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"
cuda-version = "12.2"

[target.win-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
