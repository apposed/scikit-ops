[workspace]
name = "skop-pytorch"
description = "The shared PyTorch environment: well-maintained torch libraries that can coexist."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

# This environment is meant to hold several ops, not one. Torch installs are
# large and slow, so anything torch-based that solves cleanly alongside what is
# already here belongs here rather than in an environment of its own.
#
# Three occupants now: ultralytics for the FastSAM detector, micro_sam for the
# mask detector of docs/design/0008, and Cellpose, whose own environment this
# replaced -- which is why envs/cellpose is gone.
#
# Conda-forge alone until Cellpose 4.2, which it does not carry; see
# [pypi-dependencies].
#
# envs/cellpose3 stays separate, and is the exception that shows the rule:
# Cellpose 4 replaced the v3 model zoo and moved the API with it, so the two
# cannot share an environment at any version pin.

# 12.9: micro_sam 2 needs sam-2, whose GPU builds all want CUDA 12.8 (Windows)
# or 12.9 (Linux) or newer. So this needs an NVIDIA driver from mid-2025 on.
[system-requirements]
cuda = "12.9"

[dependencies]
python = "3.11.*"
numpy = "*"
ultralytics = ">=8.3"
# NB: appose is not listed as a conda dependency here, unlike in
# envs/unseg-cv, and this is temporary. A conda appose does satisfy the
# pinned scikit-ops' PyPI dependency on it -- but only once the pin is new
# enough to have dropped scikit-ops' [tool.uv.sources] git source for
# appose, which uv honors transitively and which makes the solve
# unsatisfiable. So this goes back to `appose = ">=0.12"` above as soon as
# the rev below is bumped past that change and conda-forge carries 0.12.

# NB: micro_sam depends on `napari >=0.7.1,<0.11` and `pyqt6` outright -- it
# ships a napari plugin and does not split it out. So this environment installs
# a GUI stack that nothing in it imports; the ops use micro_sam's model and
# prompt functions, none of which touches napari. Heavy but harmless: a worker
# process never opens a window, and 0002's whole point is that this napari pin
# cannot reach the front end's.
#
# 2.x carries both families: SAM2 (`hvit_*` models) at the top and SAM1
# (`vit_*`) under micro_sam.v1, where skop.ops._microsam finds it. It also
# needs `zarr >=3` -- worth knowing when the next occupant fails to solve.
micro_sam = ">=2"

# NB: torchvision is required explicitly even though nothing here imports it
# directly. conda's ultralytics does not depend on it, but reads
# `importlib.metadata.version("torchvision")` at import time and raises
# PackageNotFoundError when it is absent -- so leaving it out fails at the
# first `from ultralytics import ...`, not at some later feature.
torchvision = "*"

# PyTorch varies by platform: CUDA builds where there are GPUs to use,
# and the plain package on Apple Silicon, where MPS comes built in.

[pypi-dependencies]
# Conda-forge stops at cellpose 4.1.1, and 4.2 is where the DINO models
# arrived; dinov3 is only on GitHub. Neither pulls a second torch -- pixi maps
# the conda pytorch onto the `torch` requirement.
cellpose = ">=4.2"
dinov3 = { git = "https://github.com/facebookresearch/dinov3" }

# InstanSeg is plain torch, PyPI only. Since 0.1 its file readers (bioio,
# rasterio, slideio) are an optional `io` extra, left out: the op is handed
# an array. The base install is torch, numpy, scikit-image and small helpers.
instanseg-torch = "*"

# Note: pinned deliberately -- this is part of the environment's identity,
# so bumping it rebuilds every environment. It comes from PyPI, so building
# needs no checkout; a checkout still shadows it (see oprunner.host.INIT).
scikit-ops = "==0.1.0.dev5"

[target.linux-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"
cuda-version = "12.9.*"

[target.win-64.dependencies]
pytorch-gpu = "*"
cudnn = "*"

[target.osx-arm64.dependencies]
pytorch = "*"
